server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https://image.tmdb.org https://*.tmdb.org https://www.keralatv.in https://upload.wikimedia.org https://o.remove.bg https://img10.hotstar.com https://www.edigitalagency.com.au https://1000logos.net https://static.vecteezy.com https://b606234.smushcdn.com https://www.iwmbuzz.com; connect-src 'self' https://api.themoviedb.org; media-src 'self' https://img10.hotstar.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
}